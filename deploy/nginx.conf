server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # HTML: alltid farskt sa att en ny deploy syns direkt
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Service workern maste alltid hamtas farsk, annars ser en ny deploy gammal ut
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Bilder, ljud, skript: kort cache, revalideras
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|mp3|wav|ogg|m4a|json|webmanifest)$ {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # SPA-fallback: okanda sokvagar hamnar i index.html
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}